version: '3.8'

services:
  spaceship-station:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/imaghost00/ghostworldsim:latest
    container_name: spaceship-station
    pull_policy: always  # Always pull latest image
    ports:
      - "0420:8000"
    environment:
      MOCK_MODE: "false"  # Set to "true" for testing without live Docker
      ENABLE_AI: "false"  # AI disabled (insufficient VRAM)
      OLLAMA_HOST: "http://ollama:11434"  # Link to Ollama container if available
      QBITTORRENT_HOST: "http://qbittorrent:8080"  # Link to qBittorrent
      LOG_LEVEL: "info"
      BROADCAST_INTERVAL: "2.0"
    volumes:
      # Mount Docker socket for live container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # Mount media directories for file browsing
      - /mnt/media:/media:ro                    # Jellyfin/Komga media
      - /mnt/downloads:/downloads:ro            # qBittorrent downloads
      - /mnt/torrents:/torrents:ro              # Torrent staging area
      
      # Mount AI tools directory for persistence
      - spaceship-tools:/app/ai_core/tools
    
    networks:
      - ghostworld
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Portainer labels for UI integration
    labels:
      # Container details
      - "com.example.description=Spaceship Station Visualizer"
      - "com.example.version=1.0.0"
      
      # Portainer UI settings
      - "io.portainer.accesscontrol.public=true"
      - "io.portainer.displayname=Spaceship Station"
      - "io.portainer.webui.port=0420"
      - "io.portainer.webui.protocol=http"
      
      # Custom groups for Portainer
      - "io.portainer.group=Monitoring"
      - "io.portainer.category=monitoring,visualizer,docker-stats"

  # Optional: Ollama service for AI features
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - ghostworld
  #   restart: unless-stopped

networks:
  ghostworld:
    external: true  # Connect to your existing ghostworld network

volumes:
  spaceship-tools:
    driver: local
  
  # ollama-data:
  #   driver: local
