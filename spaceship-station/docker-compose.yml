version: '3.8'

services:
  spaceship-station:
    # Build directly from GitHub repository
    build:
      context: https://github.com/ImAGhost00/GhostWorldSim.git#main:spaceship-station
      dockerfile: Dockerfile
    container_name: spaceship-station
    ports:
      - "4420:8000"
    environment:
      MOCK_MODE: "true"  # Switch to "false" once real services are mapped
      ENABLE_AI: "false"  # AI disabled (insufficient VRAM)
      DEBUG: "true"  # Enable debug logging
      LOG_LEVEL: "debug"  # Verbose logging for troubleshooting
      BROADCAST_INTERVAL: "2.0"
      
      # Optional: System environment (customize for your setup)
      # PUID: "1000"                    # User ID for file permissions
      # PGID: "1000"                    # Group ID for file permissions
      # TZ: "America/New_York"          # Timezone
      # MEDIA_DIRECTORY: "/media"       # Path to media pool
      # INSTALL_DIRECTORY: "/opt/yams"  # Installation directory
      # MEDIA_SERVICE: "jellyfin"       # Default media service
    volumes:
      # Mount Docker socket for live container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # Mount media directories for file browsing
      - /mnt/media:/media:ro                    # Jellyfin/Komga media
      - /mnt/downloads:/downloads:ro            # qBittorrent downloads
      - /mnt/torrents:/torrents:ro              # Torrent staging area
      
      # Mount AI tools directory for persistence
      - spaceship-tools:/app/ai_core/tools
    
    networks:
      - ghost_network
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Portainer labels for UI integration
    labels:
      # Container details
      - "com.example.description=Spaceship Station Visualizer"
      - "com.example.version=1.0.0"
      
      # Portainer UI settings
      - "io.portainer.accesscontrol.public=true"
      - "io.portainer.displayname=Spaceship Station"
      - "io.portainer.webui.port=4420"
      - "io.portainer.webui.protocol=http"
      
      # Custom groups for Portainer
      - "io.portainer.group=Monitoring"
      - "io.portainer.category=monitoring,visualizer,docker-stats"

  # Optional: Ollama service for AI features
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - ghost_network
  #   restart: unless-stopped

networks:
  ghost_network:
    external: true  # Connect to your existing ghostworld stack network

volumes:
  spaceship-tools:
    driver: local
  
  # ollama-data:
  #   driver: local
